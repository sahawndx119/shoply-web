<!-- in the name of God -->

<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section id="wrapper">
      <section id="wrapper2">
        <div id="heading">
          <img
            src="../photos/Screenshot 2025-08-18 at 11.35.58 AM.png"
            alt="shoply logo"
          />

          <h1>Log In</h1>

          <p>
            Welcome back! Log in to your account and continue your shopping
            journey with us. Access your orders, track deliveries, and discover
            exclusive offers made just for you.
          </p>
        </div>

        <section id="input">
          <form action="">
            <label for="email">E-mail</label>

            <section id="f-input">
              <input type="text" id="email" />
              <div id="emailalt">
                <img src="../photos/mail.png" alt="" />
                <p id="line">|</p>
                <p>Enter your E-mail</p>
              </div>
            </section>
          </form>

          <form action="">
            <label for="password">Password</label>

            <section id="s-input">
              <input type="text" id = "password">
              <div id="passalt">
                <img src="../photos/lock.png" alt="" />
                <p id="line">|</p>
                <p>Enter your password</p>
              </div>
            </section>
          </form>

          <a href=""> Forgot password?</a>
        </section>
      </section>
      <section id="button">
        <button>Next</button>
        <button>back</button>
      </section>
    </section>
  </body>
</html>
